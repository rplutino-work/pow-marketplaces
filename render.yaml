services:
  - type: web
    name: marketplace-microservice
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: HERMES_BASE_URL
        sync: false
      - key: MELI_CLIENT_SECRET
        sync: false
      # App centralizada de MercadoLibre (OAuth simplificado)
      - key: MELI_CENTRAL_APP_ID
        sync: false
      - key: MELI_CENTRAL_APP_SECRET
        sync: false
      - key: MICROSERVICE_BASE_URL
        sync: false
      - key: ML_API_URL
        value: https://api.mercadolibre.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromDatabase:
          name: marketplace-redis
          property: connectionString

databases:
  - name: marketplace-db
    plan: free
    databaseName: marketplace
    user: marketplace_user
  - name: marketplace-redis
    plan: free
    type: redis

